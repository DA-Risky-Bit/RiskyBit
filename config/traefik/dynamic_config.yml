http:
  middlewares:
    security-and-cors:
      headers:
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""
          ETag: ""
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
        accessControlAllowOriginList:
          - "http://admin.localhost"
          - "http://chat.localhost"
          - "http://app.localhost"
        accessControlAllowCredentials: true
        accessControlMaxAge: 100

    rate-limit:
      rateLimit:
        average: 100
        burst: 50

    gzip-compress:
      compress:
        excludedContentTypes:
          - "text/event-stream"
          - "image/png"
          - "image/jpeg"
          - "image/gif"
          - "image/webp"
          - "application/zip"
          - "application/x-gzip"
          - "video/mp4"

    request-limit:
      buffering:
        maxRequestBodyBytes: 10485760
        memRequestBodyBytes: 2097152

    default-chain:
      chain:
        middlewares:
          - security-and-cors
          - rate-limit
          - gzip-compress
          - request-limit
