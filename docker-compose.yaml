name: riskybit

x-images:
  traefik: &traefik-image traefik:v3.7
  postgres: &postgres-image postgres:18-alpine
  ollama: &ollama-image ollama/ollama:0.40.15

services:
  # Traefik Reverse Proxy
  traefik:
    image: *traefik-image
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.network=riskybit_public"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic_config.yml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.middlewares=default-chain@file"
      - "--entryPoints.web.http.aliasHeadersStrategy=delete"
      - "--entryPoints.traefik.http.aliasHeadersStrategy=delete"
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.filters.statuscodes=400-599"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/traefik/dynamic_config.yml:/etc/traefik/dynamic_config.yml:ro
    labels:
      - "com.risky-bit.group=infra"
      - "com.risky-bit.display-name=Traefik"
    networks:
      - public

  # admin.localhost
  admin-frontend:
    image: ghcr.io/da-risky-bit/admin-frontend:latest
    build:
      context: ./admin-frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.localhost`)"
      - "traefik.http.routers.admin.entrypoints=web"
      - "traefik.http.routers.admin.middlewares=request-limit@file"
      - "traefik.http.services.admin.loadbalancer.server.port=3000"
      - "com.risky-bit.group=frontend"
      - "com.risky-bit.display-name=Admin Frontend"
    networks:
      - public

  # chat.localhost
  chat-frontend:
    image: ghcr.io/da-risky-bit/chat-frontend:latest
    build:
      context: ./chat-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chat-fe.rule=Host(`chat.localhost`)"
      - "traefik.http.routers.chat-fe.entrypoints=web"
      - "traefik.http.routers.chat-fe.middlewares=request-limit@file"
      - "traefik.http.services.chat-fe.loadbalancer.server.port=3000"
      - "com.risky-bit.group=frontend"
      - "com.risky-bit.display-name=Chat Frontend"
    networks:
      - public

  # app.localhost
  challenge-frontend:
    image: ghcr.io/da-risky-bit/challenge-frontend:latest
    build:
      context: ./challenge-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.challenge-fe.rule=Host(`app.localhost`)"
      - "traefik.http.routers.challenge-fe.entrypoints=web"
      - "traefik.http.routers.challenge-fe.middlewares=request-limit@file"
      - "traefik.http.services.challenge-fe.loadbalancer.server.port=3000"
      - "com.risky-bit.group=frontend"
      - "com.risky-bit.display-name=Challenge Frontend"
    networks:
      - public

  # api.localhost (Main Backend Entry Point & Gateway)
  # No buffering middleware here: SSE streams must pass through unbuffered.
  auth-backend:
    image: ghcr.io/da-risky-bit/auth-backend:latest
    build:
      context: ./auth-backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=riskybit_public"
      - "traefik.http.routers.auth-be.rule=Host(`api.localhost`)"
      - "traefik.http.routers.auth-be.entrypoints=web"
      - "traefik.http.services.auth-be.loadbalancer.server.port=3000"
      - "com.risky-bit.group=backend"
      - "com.risky-bit.display-name=Auth Backend (Gateway)"
    networks:
      - public
      - internal-backend

  chat-backend:
    image: ghcr.io/da-risky-bit/chat-backend:latest
    build:
      context: ./chat-backend
    labels:
      - "com.risky-bit.group=backend"
      - "com.risky-bit.display-name=Chat Backend"
    networks:
      - internal-backend
    volumes:
      - ./chat-backend/logs/:/app/logs/
    depends_on:
      - db
      - ollama

  leaderboard-backend:
    image: ghcr.io/da-risky-bit/leaderboard-backend:latest
    build:
      context: ./leaderboard-backend
    labels:
      - "com.risky-bit.group=backend"
      - "com.risky-bit.display-name=Leaderboard Backend"
    networks:
      - internal-backend
    depends_on:
      - db

  docker-backend:
    image: ghcr.io/da-risky-bit/docker-backend:latest
    build:
      context: ./docker-backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yaml:/app/dist/docker-compose.yml
    labels:
      - "com.risky-bit.group=backend"
      - "com.risky-bit.display-name=Docker Backend"
    networks:
      - internal-backend
    depends_on:
      - db

  db:
    image: *postgres-image
    volumes:
      - db_data:/var/lib/postgresql
      - ./config/db:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: riskybit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASS}
    labels:
      - "com.risky-bit.group=infra"
      - "com.risky-bit.display-name=Postgres Database"
    networks:
      - internal-backend

  ollama:
    image: *ollama-image
    volumes:
      - ollama_data:/root/.ollama
      - ./config/ai/runner/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/entrypoint.sh"]
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_DEBUG=1
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_KEEP_ALIVE=-1
    labels:
      - "com.risky-bit.group=ai"
      - "com.risky-bit.display-name=Ollama"
    restart: unless-stopped
    depends_on:
      ollama-downloader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal-backend

  ollama-downloader:
    image: *ollama-image
    volumes:
      - ollama_data:/root/.ollama
      - ./config/ai/init/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/entrypoint.sh"]
    environment:
      - OLLAMA_MODEL=qwen3:4b
    labels:
      - "com.risky-bit.group=ai"
      - "com.risky-bit.display-name=Ollama Model Downloader"
    networks:
      - public

volumes:
  ollama_data:
  db_data:

networks:
  public:
    internal: false
  internal-backend:
    internal: true
